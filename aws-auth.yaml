apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-auth
  namespace: kube-system
data:
  mapRoles: |
    - rolearn: arn:aws:iam::484056256762:role/eksctl-roboshop-nodegroup-spot-NodeInstanceRole-1BBK0NSyapF4
      username: system:node:{{EC2PrivateDNSName}}
      groups:
        - system:bootstrappers
        - system:nodes
  mapUsers: |
    - userarn: arn:aws:iam::484056256762:user/pawan
      username: pawan
      groups:
        - roboshop-developer
    - userarn: arn:aws:iam::484056256762:user/deepika
      username: deepika
      groups:
        - roboshop-developer
    - userarn: arn:aws:iam::484056256762:user/sandeep
      username: sandeep
      groups:
        - roboshop-developer
